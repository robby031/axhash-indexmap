[package]
name = "axhash-indexmap"
version = "0.1.1"
edition = "2024"
authors = ["Bagus Dwi Harianto robbymangkualam2000@gmail.com"]
license = "MIT"
repository = "https://github.com/robby031/axhash-indexmap"
description = "Insertion-ordered IndexMap and IndexSet powered by indexmap (SwissTable) and the axhash engine."
keywords = ["indexmap", "ordered", "hashmap", "hash", "performance"]
categories = ["data-structures", "algorithms"]
readme = "README.md"

# ── Features ─────────────────────────────────────────────────────────────────
#
# `std`  (default) — links against std. Disable for no_std + alloc environments.
#
# Usage in no_std context:
#   axhash-indexmap = { version = "0.1", default-features = false }
#
[features]
default = ["std"]
std = ["indexmap/std"]

# ── Runtime dependencies ──────────────────────────────────────────────────────
[dependencies]
# AxBuildHasher lives in axhash-core; the axhash wrapper crate is not needed.
axhash-core = "0.8.2"

# Disable std by default; the `std` feature re-enables it via indexmap/std.
# `alloc` is always required — pure no_heap no_std would make IndexMap useless.
# indexmap is always alloc-capable; `std` feature is purely additive.
# Disable it by default so no_std consumers can opt in via our `std` feature.
indexmap = { version = "2", default-features = false }

# ── Dev dependencies ──────────────────────────────────────────────────────────
[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "indexmap_comparison"
harness = false
